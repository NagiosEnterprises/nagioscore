define timeperiod {
	timeperiod_name	none
	alias	Nothing
}

define command {
	command_name	check_me
	command_line	/bin/true
}

define command {
	command_name	notify-none
	command_line	/bin/true
}

define contact {
	contact_name	host-local
	host_notifications_enabled	1
	service_notifications_enabled	1
	host_notification_period	none
	service_notification_period	none
	host_notification_options	d,u,r
	service_notification_options	w,u,c,r
	host_notification_commands	notify-none
	service_notification_commands	notify-none
}

define contact {
	contact_name	hg-direct
	host_notifications_enabled	1
	service_notifications_enabled	1
	host_notification_period	none
	service_notification_period	none
	host_notification_options	d,u,r
	service_notification_options	w,u,c,r
	host_notification_commands	notify-none
	service_notification_commands	notify-none
}

define contact {
	contact_name	hg-oncall
	host_notifications_enabled	1
	service_notifications_enabled	1
	host_notification_period	none
	service_notification_period	none
	host_notification_options	d,u,r
	service_notification_options	w,u,c,r
	host_notification_commands	notify-none
	service_notification_commands	notify-none
}

define contact {
	contact_name	hg-group-member
	host_notifications_enabled	1
	service_notifications_enabled	1
	host_notification_period	none
	service_notification_period	none
	host_notification_options	d,u,r
	service_notification_options	w,u,c,r
	host_notification_commands	notify-none
	service_notification_commands	notify-none
}

define contact {
	contact_name	service-only
	host_notifications_enabled	1
	service_notifications_enabled	1
	host_notification_period	none
	service_notification_period	none
	host_notification_options	d,u,r
	service_notification_options	w,u,c,r
	host_notification_commands	notify-none
	service_notification_commands	notify-none
}

define contactgroup {
	contactgroup_name	hg-admins
	alias	Hostgroup admins
	members	hg-group-member
}

define contactgroup {
	contactgroup_name	hg-oncall-admins
	alias	Hostgroup oncall admins
	members	hg-oncall
}

define hostgroup {
	name	hg-contacts-template
	contacts	+hg-direct
	contact_groups	+hg-admins
	register	0
}

define hostgroup {
	hostgroup_name	linux-servers
	alias	Linux servers
	use	hg-contacts-template
	members	hg-host
	contacts	+hg-oncall
	contact_groups	+hg-oncall-admins
}

define host {
	host_name	hg-host
	alias	Host in hostgroup with contacts
	address	127.0.0.1
	max_check_attempts	2
	check_period	none
	contacts	host-local
	notification_interval	60
	notification_period	none
	check_command	check_me
}

define service {
	host_name	hg-host
	service_description	inherits-contacts
	check_command	check_me
	max_check_attempts	3
	check_interval	5
	retry_interval	1
	check_period	none
	notification_interval	60
	notification_period	none
}

define service {
	host_name	hg-host
	service_description	own-contacts
	check_command	check_me
	max_check_attempts	3
	check_interval	5
	retry_interval	1
	check_period	none
	notification_interval	60
	notification_period	none
	contacts	service-only
}
